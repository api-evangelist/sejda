    type: Documentation
  - url: https://github.com/torakiki/sejda/wiki
    type: Documentation
  - url: https://github.com/torakiki/sejda
    type: SourceCode
  description: >-
    Command-line shell over the Sejda SDK for running PDF tasks (merge, split, etc.) from a terminal or
    scripts. Requires a Java runtime. A commercial sejda-console-pro build exists. This is a local CLI
    tool, not a hosted API.
