  properties:
  - url: https://www.sejda.com/
    type: Documentation
  - url: https://www.sejda.com/help
    type: Documentation
  description: >-
    Sejda's full PDF task catalog - merge, split, compress, convert (Office/HTML to PDF, PDF to images),
    edit, watermark, OCR, and fill forms - delivered as online (browser) and desktop applications. These
    tasks are NOT exposed as a hosted REST API; only HTML-to-PDF has a documented API.
- aid: sejda:sejda-sdk
  name: Sejda SDK
  tags:
  - SDK
  - Java
  - Open Source
  - PDF Manipulation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sejda.org/
  properties:
  - url: https://sejda.org/
    type: Documentation
  - url: https://github.com/torakiki/sejda
    type: SourceCode
  - url: https://github.com/torakiki/sejda/wiki
    type: Documentation
  description: >-
    Open-source (AGPLv3) Java library for PDF manipulation - merge, split, rotate, encrypt, watermark,
    and more - built on SAMBox (a maintained PDFBox fork). This is an embeddable code library, not a hosted
    network API; a commercial Pro license is available for non-AGPL use.
- aid: sejda:sejda-console
  name: Sejda Console
  tags:
  - CLI
  - Java
  - Open Source
  - PDF Manipulation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
